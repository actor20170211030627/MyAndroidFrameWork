# 使用 jitpack.yml 明确指定构建模块, 只列出你需要发布的模块，从而将 tempgen 排除在构建之外。

jdk:
  - openjdk8
install:
  - >-            # 折叠换行为空格，并去掉末尾换行，YAML 解析后，这些行会拼成一条命令
    ./gradlew
    :ali_pay:publishToMavenLocal
    :chat_layout:publishToMavenLocal
    :database:publishToMavenLocal
    :emojis:publishToMavenLocal
    :jpush:publishToMavenLocal
    :library:publishToMavenLocal
    :map:publishToMavenLocal
    :mp_android_chart:publishToMavenLocal
    :others:publishToMavenLocal
    :picture_selector:publishToMavenLocal
    :qq_wechat:publishToMavenLocal
    :umeng:publishToMavenLocal