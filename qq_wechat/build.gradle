plugins {
    id 'com.android.library'
}
apply from: rootProject.file('scripts/publish-1.0.0.gradle')

android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion

    defaultConfig {
        minSdkVersion       rootProject.ext.android.minSdkVersion
        targetSdkVersion    rootProject.ext.android.targetSdkVersion
        versionCode         rootProject.ext.android.versionCode
        versionName         rootProject.ext.android.versionName

        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "int", "VERSION_CODE", "${defaultConfig.versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${defaultConfig.versionName}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    //style/Theme.AppCompat.Light.NoActionBar
    compileOnly rootProject.ext.dependencies.appcompat_appcompat

    //基础库
    compileOnly project(path: ':library')

    //https://wiki.connect.qq.com/sdk%E4%B8%8B%E8%BD%BD QQ登录等
    compileOnly files('../app/libs/open_sdk_3.5.15.6_r972e71b_lite.jar')
    //https://wiki.connect.qq.com/互联sdk支持maven  2021年的sdk, 也不更新一下...
//    compileOnly 'com.tencent.tauth:qqopensdk:3.52.0'

    //https://bintray.com/wechat-sdk-team/maven 微信登录支付,不包含统计功能
//    compileOnly 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:5.5.8'
    compileOnly 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.24'
}