apply plugin: 'com.android.library'

//用来生成.jar
//apply from: rootProject.file('scripts/publish-1.0.0.gradle')

android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion

    defaultConfig {
        minSdkVersion       rootProject.ext.android.minSdkVersion
        targetSdkVersion    rootProject.ext.android.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "int", "VERSION_CODE", "${defaultConfig.versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${defaultConfig.versionName}\""
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    //Android8, 在android节点内添加
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 禁用所有 variant 的 AAR 打包 (无用, jitpack.io 会报错找不到 tempgen.jar/aar)
android.libraryVariants.all { variant ->
    tasks.named("bundle${variant.name.capitalize()}Aar").configure {
        enabled = false
    }
}

dependencies {
//    implementation fileTree(dir: "libs", include: ["*.jar", '*.aar'])

    //https://github.com/greenrobot/greenDAO 数据库
    compileOnly 'org.greenrobot:greendao:3.3.0'
}
